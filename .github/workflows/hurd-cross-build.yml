name: hurd-cross-build

on:
  push:
    branches: [golang-1.26-hurd]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build host (linux/amd64) toolchain
        working-directory: src
        run: |
          export GOROOT_BOOTSTRAP=$(dirname $(dirname $(which go)))
          echo "GOROOT_BOOTSTRAP=$GOROOT_BOOTSTRAP"
          ./make.bash

      - name: Write trivial hello-world test program (no stdlib imports)
        run: |
          mkdir -p /tmp/hurdhello
          cat > /tmp/hurdhello/main.go <<'EOF'
          package main

          func main() {
              println("hello from hurd")
          }
          EOF
          cat > /tmp/hurdhello/go.mod <<'EOF'
          module hurdhello

          go 1.26
          EOF

      - name: Cross-compile for GOOS=hurd GOARCH=amd64 (CGO_ENABLED=1)
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          go version
          cd /tmp/hurdhello
          GOOS=hurd GOARCH=amd64 CGO_ENABLED=1 go build -x -o hurdhello.bin . 2>&1 | tee /tmp/build.log
          echo "BUILD_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Compile-check phase-2 packages (no link)
        if: always()
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          export GOTOOLCHAIN=local GOFLAGS=-mod=mod
          : > /tmp/pkgcheck.log
          FAIL=0
          for p in syscall internal/syscall/unix internal/poll os fmt time sync net net/http crypto/tls; do
            echo "=== $p" | tee -a /tmp/pkgcheck.log
            GOOS=hurd GOARCH=amd64 CGO_ENABLED=1 go build -gcflags=-e $p > /tmp/pkg.out 2>&1 || FAIL=1
            head -100 /tmp/pkg.out | tee -a /tmp/pkgcheck.log
          done
          echo "PKGCHECK_FAIL=$FAIL" >> "$GITHUB_ENV"
          echo "=== std (informational)" | tee -a /tmp/pkgcheck.log
          GOOS=hurd GOARCH=amd64 CGO_ENABLED=0 go build -gcflags=-e std > /tmp/std.log 2>&1 || true
          grep -c '^#' /tmp/std.log | sed 's/^/std packages with errors: /' | tee -a /tmp/pkgcheck.log
          gofmt -l src/syscall src/os src/internal/syscall/unix src/internal/poll src/runtime 2>&1 | grep -i hurd | sed 's/^/gofmt: /' | tee -a /tmp/pkgcheck.log || true

      - name: gofmt the Hurd files (produces a patch)
        if: always()
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          FILES=$(git ls-files 'src/*hurd*.go' 'src/*hurd*/*.go' | grep -v '_test.go' || true)
          gofmt -w $FILES
          git diff > /tmp/gofmt-hurd.patch
          wc -l /tmp/gofmt-hurd.patch
          git checkout -- .

      - name: Build Go test programs for Hurd
        if: always()
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          export GOTOOLCHAIN=local
          mkdir -p /tmp/gotests/out
          cd misc/hurd/tests
          for t in t_os t_fmt t_fs t_rt t_net t_http; do
            GOOS=hurd GOARCH=amd64 CGO_ENABLED=1 go build -o /tmp/gotests/out/$t.bin ./$t > /tmp/gotests/out/$t.build.log 2>&1
            echo "$t: build rc=$?"
            head -40 /tmp/gotests/out/$t.build.log
          done
          # Default cross-build mode is CGO_ENABLED=0: make sure it links and runs too.
          for t in t_fmt t_net t_http; do
            GOOS=hurd GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/gotests/out/${t}_nocgo.bin ./$t > /tmp/gotests/out/${t}_nocgo.build.log 2>&1
            echo "${t}_nocgo: build rc=$?"
            head -40 /tmp/gotests/out/${t}_nocgo.build.log
          done
          ls -l /tmp/gotests/out

      - name: Show result
        if: always()
        run: |
          echo "build rc: $BUILD_RC"
          file /tmp/hurdhello/hurdhello.bin 2>/dev/null || echo "(no binary produced)"
          echo "### Cross-build result: rc=$BUILD_RC" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log and binary (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurd-cross-build-output
          path: |
            /tmp/build.log
            /tmp/hurdhello/hurdhello.bin
            /tmp/pkgcheck.log
            /tmp/gofmt-hurd.patch
            /tmp/std.log
            /tmp/gotests/out
          if-no-files-found: warn
