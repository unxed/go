name: redox-cross-build

on:
  push:
    branches: [golang-1.26-redox]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # QEMU iteration is the bottleneck; fetch the (large) redoxer image in
      # the background while the toolchain builds instead of serially later.
      - name: Prefetch redoxer image in the background
        run: |
          nohup docker pull redoxos/redoxer > /tmp/docker-pull.log 2>&1 &

      - name: Build host (linux/amd64) toolchain
        working-directory: src
        run: |
          export GOROOT_BOOTSTRAP=$(dirname $(dirname $(which go)))
          echo "GOROOT_BOOTSTRAP=$GOROOT_BOOTSTRAP"
          ./make.bash

      - name: Write trivial hello-world test program (no stdlib imports)
        run: |
          mkdir -p /tmp/redoxhello
          cat > /tmp/redoxhello/main.go <<'EOF'
          package main

          func main() {
              println("hello from redox")
          }
          EOF
          cat > /tmp/redoxhello/go.mod <<'EOF'
          module redoxhello

          go 1.26
          EOF

      - name: Cross-compile for GOOS=redox GOARCH=amd64 (CGO_ENABLED=1)
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          go version
          cd /tmp/redoxhello
          GOOS=redox GOARCH=amd64 CGO_ENABLED=1 go build -x -o redoxhello.bin . 2>&1 | tee /tmp/build.log
          echo "BUILD_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          chmod +x /tmp/redoxhello/redoxhello.bin

      - name: Show result
        if: always()
        run: |
          echo "build rc: $BUILD_RC"
          file /tmp/redoxhello/redoxhello.bin 2>/dev/null || echo "(no binary produced)"
          echo "### Cross-build result: rc=$BUILD_RC" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log and binary (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-cross-build-output
          path: |
            /tmp/build.log
            /tmp/redoxhello/redoxhello.bin
          if-no-files-found: warn

      # Run the cross-built binary for real under redoxer (QEMU-booted Redox
      # VM; no /dev/kvm on GitHub-hosted runners so this is TCG-slow, ~1 min).
      # `-f /mnt` copies the host folder into the VM as /root/mnt/ (the
      # basename of the given path, not flattened into /root).
      - name: Run the cross-built binary under redoxer
        if: env.BUILD_RC == '0'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # joins/completes the background prefetch (the daemon dedups layers)
          docker pull redoxos/redoxer >/dev/null
          docker run --rm -v /tmp/redoxhello:/mnt redoxos/redoxer \
            redoxer exec -f /mnt -- /root/mnt/redoxhello.bin 2>&1 | tee /tmp/redoxer-exec.log

      - name: Upload redoxer exec log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redoxer-exec-output
          path: /tmp/redoxer-exec.log
          if-no-files-found: ignore

      - name: Symbolize the crash RIP (if any) with the built toolchain
        if: always()
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          rip=$(grep -a "RIP:" /tmp/redoxer-exec.log 2>/dev/null | head -1 | tr -d '\r' | awk '{print $NF}')
          if [ -z "$rip" ]; then echo "no crash RIP in log"; exit 0; fi
          echo "crash RIP = 0x$rip"
          echo "0x$rip" | go tool addr2line /tmp/redoxhello/redoxhello.bin | tee /tmp/crash-symbol.txt
          echo "### Crash at 0x$rip: $(head -1 /tmp/crash-symbol.txt) $(sed -n 2p /tmp/crash-symbol.txt)" >> "$GITHUB_STEP_SUMMARY"
          grep -a -B2 -A12 "Breakpoint trap\|Page fault\|Invalid opcode\|General protection" /tmp/redoxer-exec.log | tr -d '\r' | head -60

      # The job status is the milestone signal: green only once "hello" was
      # actually printed by a Go binary running on Redox.
      - name: Verify the Go program printed its greeting on Redox
        run: |
          grep -a "hello from redox" /tmp/redoxer-exec.log | grep -av 'println' \
            && echo "### SUCCESS: hello from redox printed by a Go binary running on Redox" >> "$GITHUB_STEP_SUMMARY" \
            || { echo "### FAILED: no greeting in redoxer output" >> "$GITHUB_STEP_SUMMARY"; \
                 grep -a "DEBUG\|RIP:\|UNHANDLED\|panic\|fatal error\|Breakpoint\|Page fault\|SIGSEGV" /tmp/redoxer-exec.log | head -40; exit 1; }
