name: redox-cross-build

on:
  push:
    branches: [golang-1.26-redox]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # QEMU iteration is the bottleneck; fetch the (large) redoxer image in
      # the background while other steps run.
      - name: Prefetch redoxer image in the background
        run: |
          nohup docker pull redoxos/redoxer > /tmp/docker-pull.log 2>&1 &

      - name: Install cc wrapper that runs redoxer's cross compiler in Docker
        timeout-minutes: 2
        run: |
          sudo tee /usr/local/bin/redox-cc >/dev/null <<'EOF'
          #!/bin/sh
          exec docker run --rm -i -v /tmp:/tmp -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" \
            redoxos/redoxer redoxer cc "$@"
          EOF
          sudo chmod +x /usr/local/bin/redox-cc

      # syscall's generated files come from relibc's real headers, not from
      # hand-written tables: cgo -godefs (types, errno/signal/etc constants)
      # via redoxer's compiler, and mksyscall_redox.pl for the libc stubs.
      - name: Generate syscall/ztypes, zerrors (cgo -godefs) and zsyscall (mksyscall)
        timeout-minutes: 3
        run: |
          set -o pipefail
          export CC=/usr/local/bin/redox-cc
          python3 .github/redox/gen_syscall.py 2>&1 | tee /tmp/gen-syscall.log
          cd src/syscall
          perl mksyscall_redox.pl -tags redox,amd64 syscall_redox.go syscall_redox_amd64.go > zsyscall_redox_amd64.go
          wc -l z*_redox_amd64.go
          cd ../..
          echo '--- drift of freshly generated files vs. the committed ones (empty = in sync) ---'
          git diff --stat -- src/syscall/z*_redox_amd64.go | tee /tmp/gen-drift.txt

      - name: Upload generated syscall files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-generated-syscall
          path: |
            src/syscall/ztypes_redox_amd64.go
            src/syscall/zerrors_redox_amd64.go
            src/syscall/zsyscall_redox_amd64.go
            /tmp/gen-syscall.log
          if-no-files-found: warn

      - name: Build host (linux/amd64) toolchain
        timeout-minutes: 4
        working-directory: src
        run: |
          export GOROOT_BOOTSTRAP=$(dirname $(dirname $(which go)))
          echo "GOROOT_BOOTSTRAP=$GOROOT_BOOTSTRAP"
          ./make.bash

      # Bulk compile check of the std packages we care about, reporting ALL
      # errors (-e) across independent packages in one round.
      - name: Compile-check std packages for GOOS=redox
        timeout-minutes: 3
        continue-on-error: true
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          go version
          GOOS=redox GOARCH=amd64 CGO_ENABLED=0 go build -gcflags=-e \
            syscall internal/syscall/unix internal/poll os fmt time os/signal os/exec io/fs net crypto/rand \
            2>&1 | tee /tmp/compile-check.log
          echo "compile-check finished; $(grep -c . /tmp/compile-check.log) lines of output"

      - name: Upload compile-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-compile-check
          path: /tmp/compile-check.log
          if-no-files-found: ignore

      # The validation ladder: independent programs of increasing difficulty,
      # each built separately so failures are attributable.
      - name: Build the validation-ladder programs
        timeout-minutes: 3
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          rm -rf /tmp/ladder && mkdir -p /tmp/ladder/out
          cp -r .github/redox/ladder/* /tmp/ladder/
          printf 'module ladder\n\ngo 1.26\n' > /tmp/ladder/go.mod
          : > /tmp/ladder-build.txt
          cd /tmp/ladder
          for d in p*/ x*/; do
            n=${d%/}
            if GOOS=redox GOARCH=amd64 CGO_ENABLED=0 go build -o out/$n.bin ./$n > /tmp/ladder-build-$n.log 2>&1; then
              echo "$n BUILD_OK" >> /tmp/ladder-build.txt
              chmod +x out/$n.bin
            else
              echo "$n BUILD_FAIL" >> /tmp/ladder-build.txt
              echo "::group::build of $n failed"; head -60 /tmp/ladder-build-$n.log; echo "::endgroup::"
            fi
          done
          cat /tmp/ladder-build.txt
          echo "LADDER_BUILT=$(grep -c BUILD_OK /tmp/ladder-build.txt)" >> "$GITHUB_ENV"
          cat > out/run_ladder.sh <<'EOF'
          # Never `wait` on a possibly wedged process (kill -9 does not always
          # free it on Redox): run it in a background subshell that records
          # its exit code, poll for that for up to 20s, and move on either way.
          run_one() {
            bin="$1"; variant="$2"; n="$3"
            echo "=== BEGIN $bin variant=$variant run=$n"
            rm -f /tmp/rc.done
            (
              case "$variant" in
                default) $bin ;;
                preempt) GODEBUG=asyncpreemptoff=0 $bin ;;
                procs1) GOMAXPROCS=1 $bin ;;
              esac
              echo $? > /tmp/rc.done
            ) &
            sp=$!
            t=0
            while [ ! -f /tmp/rc.done ] && [ $t -lt 20 ]; do sleep 1; t=$((t+1)); done
            if [ -f /tmp/rc.done ]; then
              rc=`cat /tmp/rc.done`
            else
              echo "HANG $bin"
              kill -9 $sp 2>/dev/null
              rc=hang
            fi
            echo "=== END $bin variant=$variant run=$n exit=$rc"
          }
          # file I/O and the basics first: they must always get to run
          run_one /root/mnt/p01_println.bin default 1
          run_one /root/mnt/p06_fileio.bin default 1
          run_one /root/mnt/p07_openat_diag.bin default 1
          run_one /root/mnt/p03_goroutines.bin default 1
          run_one /root/mnt/p05_timer.bin default 1
          # "default" = runtime defaults (async preemption OFF on redox, see
          # runtime1.go); "preempt" = GODEBUG=asyncpreemptoff=0 re-enables
          # the signal path that trips over relibc's RCX-clobbering sigentry
          for n in 1 2 3; do run_one /root/mnt/p02_fmt.bin default $n; done
          for n in 1 2; do run_one /root/mnt/p02_fmt.bin procs1 $n; done
          for n in 1 2 3; do run_one /root/mnt/p02_fmt.bin preempt $n; done
          run_one /root/mnt/x10_sigstorm.bin default 1
          run_one /root/mnt/x10_sigstorm.bin preempt 1
          # memory/GC-heavy rungs last: they have occasionally frozen the
          # whole VM (not just the process)
          run_one /root/mnt/p04_gc.bin default 1
          run_one /root/mnt/p09_stack.bin default 1
          run_one /root/mnt/p08_memzero.bin default 1
          echo "=== LADDER DONE"
          EOF
          ls -la out

      - name: Upload build logs and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redox-cross-build-output
          path: |
            /tmp/ladder/out
            /tmp/ladder-build-*.log
            /tmp/ladder-build.txt
          if-no-files-found: warn

      # Run all ladder programs in ONE QEMU boot (no /dev/kvm on GitHub-hosted
      # runners, so a boot is TCG-slow, ~1 min). `-f /mnt` copies the host
      # folder into the VM as /root/mnt/.
      - name: Run the ladder under redoxer
        if: env.LADDER_BUILT != '0'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          docker pull redoxos/redoxer >/dev/null
          timeout 240 docker run --rm -e REDOXER_QEMU_ARGS='-smp 2' -v /tmp/ladder/out:/mnt redoxos/redoxer \
            redoxer exec -f /mnt -- sh /root/mnt/run_ladder.sh 2>&1 | tee /tmp/redoxer-exec.log

      - name: Upload redoxer exec log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redoxer-exec-output
          path: /tmp/redoxer-exec.log
          if-no-files-found: ignore

      - name: Symbolize the crash RIP (if any) with the built toolchain
        if: always()
        run: |
          export GOROOT=$(pwd)
          export PATH=$GOROOT/bin:$PATH
          rip=$(grep -a "RIP:" /tmp/redoxer-exec.log 2>/dev/null | head -1 | tr -d '\r' | awk '{print $NF}')
          if [ -z "$rip" ]; then echo "no crash RIP in log"; exit 0; fi
          echo "crash RIP = 0x$rip"
          for b in /tmp/ladder/out/*.bin; do
            echo "--- $b"; echo "0x$rip" | go tool addr2line $b | head -2
          done
          grep -a -B4 -A14 "Breakpoint trap\|Page fault\|Invalid opcode\|General protection\|panic\|fatal error\|SIGSEGV\|goroutine " /tmp/redoxer-exec.log | tr -d '\r' | head -80

      # The job status is the milestone signal: green only when every rung of
      # the ladder built and printed its "OK <name>" line on Redox.
      - name: Ladder summary (fails unless every rung passed)
        if: always()
        run: python3 .github/redox/ladder_summary.py
